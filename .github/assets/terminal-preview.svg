<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Terminal Aide: ask, review, confirm</title>
  <desc id="description">An illustrative terminal session. A user asks for a folder size breakdown. Aide explains the command, displays du -h -d 1 . piped to sort -hr, and asks Run it? y/[n]:. After the user enters y, folder sizes appear.</desc>
  <rect x="1" y="1" width="958" height="438" rx="16" fill="#101816" stroke="#31423b" stroke-width="2"/>
  <path d="M17 2H943A15 15 0 0 1 958 17V51H2V17A15 15 0 0 1 17 2Z" fill="#1b2622"/>
  <path d="M2 51H958" stroke="#31423b"/>
  <circle cx="28" cy="27" r="6" fill="#ed756e"/>
  <circle cx="49" cy="27" r="6" fill="#e8bd68"/>
  <circle cx="70" cy="27" r="6" fill="#78c491"/>
  <text x="480" y="32" fill="#a5b6ad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">aide · ~/projects</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="32" y="95" fill="#63d5a6">❯<tspan dx="14" fill="#eff5f1">aide show a size breakdown of this folder</tspan></text>
    <g fill="#a9bdb1">
      <text x="32" y="148">Shows each immediate subfolder and the total,</text>
      <text x="32" y="175">largest first.</text>
    </g>
    <text x="32" y="227" fill="#eff5f1" font-weight="700">du -h -d 1 . | sort -hr</text>
    <text x="32" y="280" fill="#eff5f1">Run it? y/[n]: <tspan fill="#63d5a6" font-weight="700">y</tspan></text>
    <g fill="#a9bdb1">
      <text x="32" y="324">2.4G<tspan x="122">.</tspan></text>
      <text x="32" y="351">1.7G<tspan x="122">./apps</tspan></text>
      <text x="32" y="378">512M<tspan x="122">./packages</tspan></text>
      <text x="32" y="405">188M<tspan x="122">./docs</tspan></text>
    </g>
  </g>
  <text x="922" y="405" fill="#718b7d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end" letter-spacing="1.5">TERMINAL AIDE</text>
</svg>
